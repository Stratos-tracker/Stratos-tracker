name: Update manifest smoke test

# Proves the update path users actually depend on: the published version.json
# that the app checks on startup, and the installer URL it opens.
#
# The release no longer publishes electron-updater feeds (latest.yml and the
# macOS update ZIPs), so the old "install A, let A update itself to B" test has
# nothing to read. This one runs against the real published manifests on main,
# which the site serves, and checks that:
#   - version.json parses and names a version, a date and release notes;
#   - it agrees with releases.json, including the download table;
#   - the Windows installer URL answers 200 with a plausible installer size.
#
# It runs by itself after every Release run, but only once that run's "Publish
# release" job has succeeded, so a live version cannot sit there with a manifest
# that no client can act on. `workflow_dispatch` remains for checking by hand.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-manifest-smoke
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check that the release was published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CONCLUSION" != success ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The release run did not succeed; nothing to smoke-test."
            exit 0
          fi
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "Publish release" and .conclusion == "success") | .name')
          if [ -n "$JOBS" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This release run did not publish a version; nothing to smoke-test."
          fi

  manifest:
    needs: gate
    if: needs.gate.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The site serves app/version.json from main, so the manifest the release
      # wrote back is exactly what a client will read.
      - name: Check the published update manifests on main
        run: node scripts/check-version-manifest.mjs

      - name: Confirm the release page carries only installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          BAD=$(echo "$ASSETS" | grep -E '\.(yml|blockmap|sha256)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::the release page still carries updater or checksum files: $BAD"
            exit 1
          fi
          COUNT=$(echo "$ASSETS" | grep -c . || true)
          if [ "$COUNT" -gt 5 ]; then
            echo "::error::$COUNT assets are attached; at most five installers are expected"
            exit 1
          fi
          echo "Release v$VERSION carries $COUNT installer(s) and nothing else."
