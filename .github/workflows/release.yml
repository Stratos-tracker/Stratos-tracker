name: Release

# One pipeline releases Stratos. It runs when:
#   - package.json gains a version on main that has no published release yet
#     (an automatic release on a version bump),
#   - a v* tag is pushed, or
#   - it is started by hand, which releases the version in package.json.
#
# A v* tag must point at a commit on main. The website and installed PWA are
# deployed from main, so an off-main tag would publish desktop installers while
# leaving mobile on the previous version.
#
# Tests run first. Windows, macOS (arm64 and x64) and Linux are then built in
# parallel, and only one job, "Publish release", creates the release. That job
# uploads everything as a draft, checks the draft against the published rules
# (scripts/check-release.mjs), and only then makes it public. A failed platform
# build therefore never leaves a half-published version behind.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      severity:
        description: 'Update severity published in the manifest'
        type: choice
        options: [normal, important, critical]
        default: normal
      reason:
        description: 'Why a critical update is required (required for critical)'
        type: string
        required: false
      skip_macos:
        description: 'Release Windows and Linux only (for when GitHub offers no macOS runner)'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      severity: ${{ steps.decide.outputs.severity }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The version-bump check reads package.json from the commit that came
          # before the push, so the full history is needed.
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_SEVERITY: ${{ github.event.inputs.severity }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              TRIGGER=tag
              VERSION="${GITHUB_REF_NAME#v}" ;;
            refs/heads/main)
              if [ "$EVENT_NAME" = workflow_dispatch ]; then TRIGGER=dispatch; else TRIGGER=main; fi
              VERSION=$(node -p "require('./package.json').version") ;;
            *)
              echo "::error::Releases are cut from main or a v* tag, not from $GITHUB_REF"
              exit 1 ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not a plain X.Y.Z version"
            exit 1
          fi
          TAG="v$VERSION"

          # The website and mobile PWA deploy from main. Reject an off-main tag
          # before any platform build starts, so a release cannot ship desktop
          # installers while leaving the hosted app on an older version.
          if [ "$TRIGGER" = tag ]; then
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG is not on main. Merge and push the release to main before pushing the tag; the website and mobile PWA deploy from main."
              exit 1
            fi
          fi

          # A draft left by an earlier failed run is replaced; a published release
          # is never rebuilt.
          STATE=none
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then STATE=draft; else STATE=published; fi
          fi

          RELEASE=true
          REASON=""
          if [ "$STATE" = published ]; then
            RELEASE=false
            REASON="$TAG is already published"
            if [ "$TRIGGER" = dispatch ]; then
              echo "::error::$REASON; bump package.json before releasing"
              exit 1
            fi
          elif [ "$TRIGGER" = main ]; then
            # A push to main releases only when this push changed the version.
            PREV=""
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              PREV=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || true)
            fi
            if [ "$PREV" = "$VERSION" ]; then
              RELEASE=false
              REASON="package.json still says $VERSION; nothing to release"
            fi
          fi

          {
            echo "release=$RELEASE"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "severity=${INPUT_SEVERITY:-normal}"
          } >> "$GITHUB_OUTPUT"
          echo "- $TAG ($TRIGGER): release=$RELEASE ${REASON}" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run tests
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # The suite's own output is kept, because a failure that only the runner can
      # reproduce is a failure nobody can fix from a check mark: the next step
      # publishes the failing lines as annotations on the commit.
      - name: Run JavaScript and relay tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Report a failing test suite
        if: failure()
        shell: bash
        run: |
          if [ -f test-output.log ]; then
            echo '### npm test (last lines)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 test-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -aE 'not ok|^✖|AssertionError|Error:|expected|actual|^# (tests|pass|fail)|ℹ (tests|pass|fail)' test-output.log | tail -24 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo '::error::the test run produced no output file'
          fi

      - name: Run bridge tests
        run: python -m unittest -v tests.test_bridge

      - name: Run bridge + relay integration test
        run: npm run test:integration

  build-windows:
    name: Build Windows installer
    needs: [plan, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # Stamp the release version into the app and the bridge so the installed
      # build reports the version being released.
      - name: Stamp the release version
        run: |
          npm version --no-git-tag-version --allow-same-version "$VERSION" --silent
          python scripts/stamp-version.py "$VERSION"

      - name: Build standalone simulator bridge
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          # --specpath moves the spec file, and PyInstaller resolves --add-data
          # sources relative to that spec, so the dataset is given as an
          # absolute path.
          # app/ must travel with the exe: the bridge is what serves the phone's
          # live page, and without these files every static route answers 404.
          pyinstaller --noconfirm --clean --onefile --name stratos-bridge --distpath bridge-dist --workpath build/pyinstaller --specpath build --add-data "$GITHUB_WORKSPACE/navdata/cifp;navdata/cifp" --add-data "$GITHUB_WORKSPACE/app;app" stratos_bridge.py
          test -f bridge-dist/stratos-bridge.exe || { echo "::error::PyInstaller did not produce stratos-bridge.exe"; exit 1; }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Check the build output
        run: |
          set -euo pipefail
          test -s dist/Stratos-Setup.exe || { echo "::error::electron-builder did not produce Stratos-Setup.exe"; exit 1; }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Stratos-Setup.exe
          retention-days: 7

  build-mac:
    name: Build macOS ${{ matrix.arch }}
    needs: [plan, test]
    # A release can go out without macOS when GitHub has no macOS runner to give
    # (the job is cancelled after fifteen minutes in the queue). The publish job
    # then checks only the platforms that were built and the manifest carries no
    # installer for the ones that were not, so no Mac is offered a Windows setup.
    if: needs.plan.outputs.release == 'true' && inputs.skip_macos != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Stamp the release version
        run: |
          npm version --no-git-tag-version --allow-same-version "$VERSION" --silent
          python scripts/stamp-version.py "$VERSION"

      - name: Build standalone simulator bridge
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          # app/ must travel with the binary: the bridge serves the phone's live
          # page, so a bundle without it answers 404 for every static route.
          pyinstaller --noconfirm --clean --onefile --name stratos-bridge --distpath bridge-dist --workpath build/pyinstaller --specpath build --add-data "$GITHUB_WORKSPACE/navdata/cifp:navdata/cifp" --add-data "$GITHUB_WORKSPACE/app:app" stratos_bridge.py
          test -f bridge-dist/stratos-bridge || { echo "::error::PyInstaller did not produce stratos-bridge"; exit 1; }

      - name: Build macOS app
        run: npm run dist:mac -- --${{ matrix.arch }}

      # Every Mac runner writes the same feed name, so each one keeps its own
      # copy; the publish job merges them so both architectures are offered.
      - name: Name this architecture's update feed and check the output
        run: |
          set -euo pipefail
          mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.arch }}.yml"
          test -s "dist/Stratos-${VERSION}-mac-${{ matrix.arch }}.dmg" || { echo "::error::the DMG is missing"; exit 1; }
          test -s "dist/Stratos-${VERSION}-mac-${{ matrix.arch }}.zip" || { echo "::error::the update ZIP is missing"; exit 1; }

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
          retention-days: 7

  build-linux:
    name: Build Linux AppImage
    needs: [plan, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Stamp the release version
        run: |
          npm version --no-git-tag-version --allow-same-version "$VERSION" --silent
          python scripts/stamp-version.py "$VERSION"

      - name: Build standalone simulator bridge
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          # app/ must travel with the binary: the bridge serves the phone's live
          # page, so a bundle without it answers 404 for every static route.
          pyinstaller --noconfirm --clean --onefile --name stratos-bridge --distpath bridge-dist --workpath build/pyinstaller --specpath build --add-data "$GITHUB_WORKSPACE/navdata/cifp:navdata/cifp" --add-data "$GITHUB_WORKSPACE/app:app" stratos_bridge.py
          test -f bridge-dist/stratos-bridge || { echo "::error::PyInstaller did not produce stratos-bridge"; exit 1; }

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Check the build output
        run: |
          set -euo pipefail
          test -s "dist/Stratos-${VERSION}-linux-x64.AppImage" || { echo "::error::the AppImage is missing"; exit 1; }
          test -s dist/latest-linux.yml || { echo "::error::electron-builder did not produce latest-linux.yml"; exit 1; }

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
          retention-days: 7

  publish:
    # The update-smoke workflow looks for a successful job with this exact name.
    name: Publish release
    needs: [plan, build-windows, build-mac, build-linux]
    # always() keeps a deliberately skipped macOS build from cancelling the
    # release; the result checks still stop a release whose builds failed.
    if: always() && needs.plan.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SEVERITY: ${{ needs.plan.outputs.severity }}
      REASON: ${{ github.event.inputs.reason }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The changelog is built from the commits between the previous tag and
          # this one, so the runner needs the tags and their history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Collect every platform's build output
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # The installers also go to our own download host, so the manifest the site
      # serves names a URL we control instead of a third-party file host. The
      # script fails the release if the bucket is configured but does not serve
      # the file, and it is skipped when the secrets are absent: a release still
      # publishes, with the release's own URLs.
      #
      # The presence of the secrets is decided in the shell, not in `if`: the
      # `secrets` context is not available to a step condition, and referring to
      # it there makes the whole workflow file invalid, so GitHub refuses to
      # start any run of it at all rather than skipping one step.
      - name: Mirror the installers to our download host
        id: mirror
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE || 'https://downloads.stratos-tracker.com' }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "No download-host secrets are configured, so this release keeps the release's own installer URLs."
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/publish-installers.mjs --dir dist --tag "$TAG"
          echo "base=${R2_PUBLIC_BASE%/}/$TAG" >> "$GITHUB_OUTPUT"

      - name: Write the checksum and the download table
        env:
          MIRROR_BASE: ${{ steps.mirror.outputs.base }}
        run: |
          set -euo pipefail
          # Windows and Linux must be built. A macOS build that never ran is
          # recorded, left out of the download table, and reported to
          # check-release, which then does not expect those assets.
          MISSING=""
          for pair in "windows:Stratos-Setup.exe" \
                      "mac-arm64:Stratos-${VERSION}-mac-arm64.dmg" \
                      "mac-x64:Stratos-${VERSION}-mac-x64.dmg" \
                      "linux-x64:Stratos-${VERSION}-linux-x64.AppImage"; do
            key="${pair%%:*}"
            name="${pair#*:}"
            if [ -s "dist/$name" ]; then continue; fi
            if [ "$key" = mac-arm64 ] || [ "$key" = mac-x64 ]; then
              MISSING="${MISSING:+$MISSING,}$key"
            else
              echo "::error::$name is missing from the build output"
              exit 1
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::this release carries no installer for: $MISSING"
            echo "### No installer for $MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "The macOS build did not run, so this release is Windows and Linux only." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ALLOW_MISSING=$MISSING" >> "$GITHUB_ENV"
          BASE="${MIRROR_BASE:-https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}}"
          add() {
            jq -n --arg key "$1" \
              --arg url "${BASE}/$2" \
              --arg sha "$(sha256sum "dist/$2" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "dist/$2")" \
              '{($key): {url: $url, sha256: $sha, size: $size}}' >> dist/downloads.jsonl
          }
          : > dist/downloads.jsonl
          add windows Stratos-Setup.exe
          if [ -s "dist/Stratos-${VERSION}-mac-arm64.dmg" ]; then add mac-arm64 "Stratos-${VERSION}-mac-arm64.dmg"; fi
          if [ -s "dist/Stratos-${VERSION}-mac-x64.dmg" ]; then add mac-x64 "Stratos-${VERSION}-mac-x64.dmg"; fi
          add linux-x64 "Stratos-${VERSION}-linux-x64.AppImage"
          jq -s add dist/downloads.jsonl > dist/downloads.json
          cat dist/downloads.json

      # The notes and manifest are generated from the commits being released, so
      # they describe what is actually in this build. The committed manifest is
      # only read for its history; the release gets a copy, and the publish job
      # writes that copy back to main once the release is live.
      - name: Write the release notes and manifest
        run: |
          set -euo pipefail
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          cp app/releases.json dist/releases.json
          ARGS=(--version "$VERSION" --severity "$SEVERITY" --markdown dist/release-notes.md --manifest dist/releases.json --downloads-file dist/downloads.json)
          if [ -n "$PREVIOUS" ]; then ARGS+=(--from "$PREVIOUS"); fi
          if [ "$SEVERITY" = critical ]; then ARGS+=(--reason "$REASON"); fi
          node scripts/release-notes.mjs "${ARGS[@]}"
          node scripts/release-notes.mjs --check --manifest dist/releases.json

      # A draft is invisible to users, so everything can be checked before the
      # release goes live. An earlier draft for this tag is replaced.
      - name: Create the draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$TAG was published while this run was building"
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          # One installer per platform, and nothing else. Updates are announced
          # from version.json and installed by running the published installer,
          # so updater feeds, update ZIPs, blockmaps, checksum sidecars and copies
          # of the notes or the manifest are no longer attached.
          # Only the files that were actually built are attached; a DMG glob that
          # matches nothing would be passed to gh as a literal path and fail.
          ASSETS=(dist/Stratos-Setup.exe)
          for extra in dist/*.AppImage dist/*.dmg; do
            if [ -f "$extra" ]; then ASSETS+=("$extra"); fi
          done
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Stratos $VERSION" --notes-file dist/release-notes.md \
            "${ASSETS[@]}"

      - name: Check the draft against every platform
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE || 'https://downloads.stratos-tracker.com' }}
        run: node scripts/check-release.mjs "$VERSION" --draft ${ALLOW_MISSING:+--allow-missing="$ALLOW_MISSING"}

      - name: Publish and confirm the live release
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          node scripts/check-release.mjs "$VERSION" ${ALLOW_MISSING:+--allow-missing="$ALLOW_MISSING"}
          echo "- Published $TAG" >> "$GITHUB_STEP_SUMMARY"

      # The website is built from main and serves app/releases.json from its own
      # origin; the browser reads the GitHub asset only when that copy cannot be
      # loaded. The generated manifest therefore has to be on main, or the site
      # announces a version with no installer beside it until the next release.
      - name: Record the manifest on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout -B main origin/main
            cp dist/releases.json app/releases.json
            # version.json is what the app checks on startup; it is served from
            # the same origin as the site, so it belongs on main beside the full
            # manifest, not only inside the build.
            cp dist/version.json app/version.json
            if git diff --quiet -- app/releases.json app/version.json; then
              echo "app/releases.json and app/version.json already carry $TAG"
              exit 0
            fi
            git add app/releases.json app/version.json
            git commit --quiet -m "Publish the $VERSION download table" \
              -m "The site serves this manifest from its own origin, so the installer URLs, hashes and sizes written for the release belong on main, not only on the release."
            if git push --quiet origin main; then
              echo "app/releases.json and app/version.json on main now describe $TAG"
              exit 0
            fi
            echo "main moved while $TAG was being published; retrying from its new head"
            sleep 5
          done
          echo "::error::app/releases.json could not be updated on main"
          exit 1
