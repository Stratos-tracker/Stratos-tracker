<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirm your email · Stratos</title>
<meta name="theme-color" content="#06080a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="stratos-ui.css">
<link rel="stylesheet" href="account.css">
<meta name="robots" content="noindex">
</head>
<body class="acct" data-auth="verify">
<header class="acct-top">
  <a class="acct-brand" href="index.html">
    <span data-brand-mark aria-hidden="true"></span>
    <span>STRATOS<small>ACCOUNT</small></span>
  </a>
  <nav class="acct-top__nav">
    <a href="login.html">Sign in</a>
  </nav>
</header>

<main class="acct-main">
  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-head" id="verify-state">
      <h1 id="auth-title">Confirming your address</h1>
      <p>One moment while the link is checked.</p>
    </div>
    <p class="auth-alt">Wrong account? <a href="login.html">Sign in instead</a></p>
  </section>
</main>

<p class="auth-foot">Confirmation links work once and expire after two days.</p>

<script type="module" src="js/account/auth.js"></script>
</body>
</html>
