<style>
:root {
  --bg:#0b1118; --land:#121a23; --coast:#3a4a5c;
  --txt:#e6edf4; --ui:rgba(13,18,25,.94); --ui2:#1a2330; --mut:#8696a8;
  --acc:#22d3ee; --red:#f87171; --grn:#34d399; --warn:#fbbf24; --mag:#c084fc;
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--txt);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  overscroll-behavior: none;
}
a { color: var(--acc); }

/* ── Layout ── */
#app { display: flex; flex-direction: column; min-height: 100dvh; }

/* ── Topbar ── */
#topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  padding-top: calc(10px + env(safe-area-inset-top,0px));
  background: var(--ui); border-bottom: 1px solid var(--ui2);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  position: sticky; top: 0; z-index: 20;
}
#topbar a.home { font-size: 20px; font-weight: 800; letter-spacing: .03em; color: var(--txt); text-decoration: none; }
#topbar a.home span { color: var(--acc); }
#topbar h1 { font-size: 13px; font-weight: 600; color: var(--mut); margin: 0;
  letter-spacing: .04em; text-transform: uppercase; border-left: 1px solid var(--ui2); padding-left: 10px; }
.spacer { flex: 1; }
.topbar-btn {
  background: var(--ui2); border: 1px solid var(--coast); border-radius: 8px;
  color: var(--txt); font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer;
}

/* ── Tab bar ── */
#tab-bar {
  display: flex; background: var(--ui2); border-bottom: 1px solid var(--coast);
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
#tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; padding: 12px 16px; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--mut); background: none; border: none; border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap;
}
.tab-btn.act { color: var(--acc); border-bottom-color: var(--acc); }

/* ── Live status bar ── */
#live-bar {
  display: none; align-items: center; gap: 8px; padding: 8px 14px;
  background: rgba(34,211,238,.07); border-bottom: 1px solid rgba(34,211,238,.2);
  font-size: 12px;
}
#live-bar.show { display: flex; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grn);
  box-shadow: 0 0 8px var(--grn); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
#live-state-label { font-weight: 700; color: var(--acc); }

/* ── Main ── */
#main { flex: 1; padding: 14px; max-width: 900px; width: 100%; margin: 0 auto; }

/* ── Grid stat tiles ── */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 14px;
}
.stat-tile {
  background: var(--ui2); border: 1px solid var(--coast); border-radius: 12px;
  padding: 12px 14px;
}
.stat-tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-tile.big b { font-size: 32px; }
.stat-tile span { font-size: 11px; color: var(--mut); letter-spacing: .04em; }

/* ── Section ── */
.section { background: var(--ui2); border: 1px solid var(--coast); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.section h2 { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; }

/* ── Flight list ── */
.flight-row {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 0;
  border-bottom: 1px solid rgba(58,74,92,.35); cursor: pointer;
}
.flight-row:last-child { border-bottom: none; }
.flight-row:hover { background: rgba(34,211,238,.04); border-radius: 8px; margin: 0 -8px; padding: 10px 8px; }
.fl-badge {
  background: var(--land); border: 1px solid var(--coast); border-radius: 8px;
  padding: 6px 10px; font-size: 11px; font-weight: 700; color: var(--acc);
  min-width: 56px; text-align: center; letter-spacing: .05em;
}
.fl-main { flex: 1; min-width: 0; }
.fl-route { font-size: 15px; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-sub { font-size: 12px; color: var(--mut); }
.fl-right { text-align: right; font-size: 12px; color: var(--mut); }
.fl-right b { display: block; font-size: 13px; color: var(--txt); }
.fl-incomplete { opacity: .55; }
.fl-incomplete .fl-badge { color: var(--warn); border-color: var(--warn); }

/* ── Aircraft / Airport cards ── */
.ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 10px; }
.ac-card {
  background: var(--land); border: 1px solid var(--coast); border-radius: 12px;
  padding: 12px 14px; cursor: pointer;
}
.ac-card:hover { border-color: var(--acc); }
.ac-card .ac-type { font-size: 18px; font-weight: 800; letter-spacing: .02em; margin-bottom: 4px; }
.ac-card .ac-reg { font-size: 11px; color: var(--mut); font-variant-numeric: tabular-nums; }
.ac-card .ac-stats { display: flex; gap: 10px; margin-top: 8px; }
.ac-stat { text-align: center; flex: 1; background: var(--ui2); border-radius: 8px; padding: 6px; }
.ac-stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.ac-stat span { font-size: 10px; color: var(--mut); }

/* ── Aircraft photography ── */
.ac-card { overflow: hidden; }
.ac-photo { display: block; width: calc(100% + 28px); margin: -12px -14px 10px; height: 96px; object-fit: cover; background: var(--ui2); }
.ac-photo.no-shot { display: none; }
.fl-shot { width: 64px; height: 44px; flex: 0 0 64px; border-radius: 8px; object-fit: cover; background: var(--ui2); border: 1px solid var(--coast); }
.fl-shot.no-shot { display: none; }
.acp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.acp-head h2 { margin: 0; font-size: 18px; }
.acp-reg { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--acc); }
.acp-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--mut); margin-bottom: 10px; }
.acp-shot { margin: 0 0 8px; border-radius: 14px; overflow: hidden; background: var(--ui2); border: 1px solid var(--coast); }
.acp-shot img { display: block; width: 100%; max-height: 300px; object-fit: cover; }
.acp-shot figcaption { padding: 7px 10px; font-size: 10.5px; color: var(--mut); }
.acp-shot a { color: var(--acc); text-decoration: none; }
.acp-shot a:hover { text-decoration: underline; }
.acp-shot.none { display: flex; flex-direction: column; gap: 4px; padding: 22px 14px; text-align: center; }
.acp-shot.none b { font-size: 15px; }
.acp-shot.none span { font-size: 11.5px; color: var(--mut); }
.acp-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 2px; }
.acp-btn { background: var(--ui2); border: 1px solid var(--coast); border-radius: 9px; color: var(--txt); font: inherit; font-size: 12px; font-weight: 600; padding: 8px 13px; cursor: pointer; }
.acp-btn:hover { border-color: var(--acc); }
.acp-btn:disabled { opacity: .45; cursor: default; }
.acp-btn.primary { background: var(--acc); border-color: var(--acc); color: #04212b; }
.acp-msg { font-size: 11.5px; color: var(--mut); }
.acp-gallery { display: grid; gap: 8px; }
.acp-stage { position: relative; border-radius: 12px; overflow: hidden; background: var(--ui2); border: 1px solid var(--coast); }
.acp-stage img { display: block; width: 100%; max-height: 280px; object-fit: contain; background: #05090f; }
.acp-stage .acp-nav { position: absolute; top: 50%; transform: translateY(-50%); }
.acp-stage .acp-nav.prev { left: 8px; }
.acp-stage .acp-nav.next { right: 8px; }
.acp-empty { padding: 26px 14px; text-align: center; font-size: 12px; color: var(--mut); }
.acp-thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.acp-thumb { position: relative; flex: 0 0 auto; width: 72px; height: 50px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: var(--ui2); }
.acp-thumb.on { border-color: var(--acc); }
.acp-thumb .pick { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.acp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acp-thumb .x { position: absolute; top: 1px; right: 1px; width: 17px; height: 17px; border: 0; border-radius: 5px; background: rgba(3,7,18,.72); color: #e2e8f0; font-size: 11px; line-height: 1; cursor: pointer; }
.acp-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.acp-bar label { font-size: 11px; color: var(--mut); display: flex; align-items: center; gap: 6px; }
.acp-bar select { background: var(--land); border: 1px solid var(--coast); border-radius: 8px; color: var(--txt); font: inherit; font-size: 12px; padding: 6px 8px; }
.acp-upload { display: inline-flex; align-items: center; gap: 6px; background: var(--ui2); border: 1px dashed var(--coast); border-radius: 9px; padding: 7px 11px; font-size: 12px; cursor: pointer; }
.acp-upload input { display: none; }
@media (max-width: 480px) { .fl-shot { width: 52px; flex-basis: 52px; height: 40px; } }

/* ── Achievements ── */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; }
.ach-card {
  background: var(--land); border: 1px solid var(--coast); border-radius: 12px;
  padding: 12px; text-align: center;
}
.ach-card.earned { border-color: var(--warn); background: rgba(251,191,36,.06); }
.ach-icon { font-size: 32px; line-height: 1; margin-bottom: 6px; }
.ach-card.locked .ach-icon { filter: grayscale(1) opacity(.4); }
.ach-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.ach-card.locked .ach-name { color: var(--mut); }
.ach-desc { font-size: 11px; color: var(--mut); }
.ach-card.earned .ach-date { font-size: 10px; color: var(--warn); margin-top: 4px; }
.ach-prog { height: 3px; background: var(--ui2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.ach-prog-fill { height: 100%; background: var(--acc); border-radius: 2px; }

/* ── Bar chart ── */
.bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-top: 8px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.bar-fill { width: 100%; background: var(--acc); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .7; }
.bar-label { font-size: 9px; color: var(--mut); }

/* ── Detail panel ── */
#detail-panel {
  display: none; position: fixed; inset: 0; z-index: 30;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
}
#detail-panel.show { display: flex; align-items: flex-end; }
#detail-inner {
  background: var(--bg); border-top: 1px solid var(--coast);
  border-radius: 20px 20px 0 0; width: 100%; max-height: 80dvh; overflow-y: auto;
  padding: 20px 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom,0px));
}
#detail-inner h2 { margin: 0 0 12px; font-size: 18px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.detail-cell { background: var(--ui2); border-radius: 10px; padding: 10px 12px; }
.detail-cell b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.detail-cell span { font-size: 11px; color: var(--mut); }

/* ── Profile edit ── */
#profile-section input, #profile-section textarea, #profile-section select {
  width: 100%; background: var(--land); border: 1px solid var(--coast); border-radius: 8px;
  color: var(--txt); font: inherit; padding: 10px 12px; margin-top: 4px; outline: none;
}
#profile-section input:focus, #profile-section textarea:focus { border-color: var(--acc); }
#profile-section label { font-size: 12px; color: var(--mut); display: block; margin-top: 10px; }
.save-btn {
  background: var(--acc); color: #04212b; border: none; border-radius: 10px;
  font: inherit; font-size: 14px; font-weight: 700; padding: 12px 24px;
  cursor: pointer; margin-top: 14px; width: 100%;
}
.save-btn:hover { filter: brightness(1.1); }
.share-btn {
  background: var(--ui2); border: 1px solid var(--coast); border-radius: 10px;
  font: inherit; font-size: 13px; font-weight: 600; padding: 10px 16px;
  cursor: pointer; color: var(--txt); margin-top: 8px; width: 100%;
}
.avatar-circle {
  width: 72px; height: 72px; border-radius: 50%; background: var(--coast);
  display: flex; align-items: center; justify-content: center; font-size: 28px;
  border: 2px solid var(--acc); margin-bottom: 10px;
}
.pilot-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.pilot-info h3 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
.pilot-info p { margin: 0; font-size: 13px; color: var(--mut); }

/* ── Empty / Bridge state ── */
.empty-block { text-align: center; padding: 40px 20px; color: var(--mut); }
.empty-block .big-icon { font-size: 44px; margin-bottom: 10px; }

/* ── Bottom nav ── */
#bottom-nav {
  position: sticky; bottom: 0; display: flex;
  background: var(--ui); border-top: 1px solid var(--ui2);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0; font-size: 10px; font-weight: 600; color: var(--mut);
  text-decoration: none; letter-spacing: .03em;
}
.bnav-item .icon { font-size: 20px; line-height: 1; }
.bnav-item.act { color: var(--acc); }

@media (max-width: 480px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr 1fr; }
}
</style>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   STORAGE  (IndexedDB with localStorage fallback)
═══════════════════════════════════════════════════════════════════════ */
const DB_NAME = 'stratos_logbook', DB_VER = 3;
let db = null;

function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('flights')) {
        const fs = d.createObjectStore('flights', { keyPath: 'id' });
        fs.createIndex('startTime', 'startTime');
        fs.createIndex('state', 'state');
      }
      if (!d.objectStoreNames.contains('profile')) {
        d.createObjectStore('profile', { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}

async function dbAll(store) {
  await ensureDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function dbPut(store, obj) {
  await ensureDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

async function dbDelete(store, key) {
  await ensureDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

async function ensureDB() {
  if (!db) await idbOpen();
}

/* ════════════════════════════════════════════════════════════════════
   PROFILE  (name, callsign, avatar, bio, prefs)
═══════════════════════════════════════════════════════════════════════ */
let profile = {
  displayName: '', username: '', avatar: '✈', bio: '',
  sim: 'X-Plane 12', units: 'aviation', public: false, showFlights: true
};

async function loadProfile() {
  const rows = await dbAll('profile');
  rows.forEach(r => { if (r.key === 'main') profile = { ...profile, ...r.value }; });
}

async function saveProfile() {
  await dbPut('profile', { key: 'main', value: profile });
}

/* ════════════════════════════════════════════════════════════════════
   FLIGHT STATE MACHINE
   States: PARKED → TAXI → AIRBORNE → LANDED → COMPLETE
═══════════════════════════════════════════════════════════════════════ */
const THRESHOLDS = {
  taxiSpd: 2,       // kt — above this = TAXI (not parked)
  airborneAGL: 30,  // ft AGL — above this and spd > takeoffSpd = AIRBORNE
  takeoffSpd: 40,   // kt GS — used with AGL to confirm takeoff
  landedAGL: 20,    // ft AGL — below this again after flight = possible landing
  landedSpd: 60,    // kt — below this = landed (not touch-and-go)
  parkedSpd: 2,     // kt — below this on ground = parked
  parkedSec: 30,    // seconds of being parked to confirm LANDED→COMPLETE
  minFlightSec: 60  // seconds airborne to count as a real flight
};

let currentFlight = null; // live tracking object
let parkedTimer   = null;
let liveTimerInt  = null;

function newFlight(data) {
  return {
    id: 'flt_' + Date.now(),
    state: 'PARKED',
    startTime: Date.now(),
    takeoffTime: null,
    landingTime: null,
    endTime: null,
    depAirport: null,
    arrAirport: null,
    aircraft: data.aircraft || 'Unknown',
    registration: data.registration || '',
    callsign: data.callsign || '',
    sim: data.sim || 'Unknown',
    maxAlt: 0,
    track: [],         // [{lat,lon,alt,t}]
    fuelDep: null,
    fuelArr: null,
    landingVS: null,   // fpm at touchdown
    complete: false,
    incomplete: false
  };
}

function processTelemetry(data) {
  // data: { lat, lon, alt, agl, gs, hdg, vs, src, fuel }
  if (!data || data.lat == null) return;

  // Start new flight if none active
  if (!currentFlight) {
    currentFlight = newFlight({ sim: data.src || 'Simulator' });
  }

  const f = currentFlight;
  const now = Date.now();

  // Update maximums
  if (data.alt > (f.maxAlt || 0)) f.maxAlt = data.alt;

  // Add to track (every ~10 seconds or 1nm moved)
  const last = f.track[f.track.length - 1];
  if (!last || now - last.t > 10000 || (f.state === 'AIRBORNE' && haversineNm(last, data) > 0.5)) {
    f.track.push({ lat: data.lat, lon: data.lon, alt: data.alt, t: now });
    if (f.track.length > 3000) f.track.splice(0, f.track.length - 3000);
  }

  const onGround = (data.agl || 0) < THRESHOLDS.landedAGL;
  const gs = data.gs || 0;

  switch (f.state) {
    case 'PARKED':
      if (gs > THRESHOLDS.taxiSpd) {
        f.state = 'TAXI';
        f.depAirport = nearestAirport(data.lat, data.lon);
        f.fuelDep = data.fuel || null;
      }
      break;

    case 'TAXI':
      if (data.agl > THRESHOLDS.airborneAGL && gs > THRESHOLDS.takeoffSpd) {
        f.state = 'AIRBORNE';
        f.takeoffTime = now;
        updateLiveBar();
      }
      if (gs < THRESHOLDS.parkedSpd && onGround) f.state = 'PARKED';
      break;

    case 'AIRBORNE':
      if (onGround && gs < THRESHOLDS.landedSpd) {
        f.state = 'LANDED';
        f.landingTime = now;
        f.arrAirport = nearestAirport(data.lat, data.lon);
        f.fuelArr = data.fuel || null;
        if (data.vs !== undefined) f.landingVS = data.vs; // fpm, negative = descent
        clearTimeout(parkedTimer);
        parkedTimer = setTimeout(() => completeFlight(f), THRESHOLDS.parkedSec * 1000);
      }
      break;

    case 'LANDED':
      // Re-airborne (touch-and-go)
      if (data.agl > THRESHOLDS.airborneAGL && gs > THRESHOLDS.takeoffSpd) {
        clearTimeout(parkedTimer);
        f.state = 'AIRBORNE';
        f.landingTime = null;
        f.arrAirport = null;
        f.landingVS = null;
      }
      break;
  }

  updateLiveBar(f);
}

async function completeFlight(f) {
  if (f.complete) return; // idempotent
  f.complete = true;
  f.state = 'COMPLETE';
  f.endTime = Date.now();

  const flightSec = f.takeoffTime && f.landingTime
    ? (f.landingTime - f.takeoffTime) / 1000 : 0;

  if (flightSec < THRESHOLDS.minFlightSec) {
    f.incomplete = true;
  }

  // Distance from track
  f.distanceNm = trackDistance(f.track);

  // Save
  await dbPut('flights', f);
  currentFlight = null;

  // Check achievements
  const all = await dbAll('flights');
  await checkAchievements(all);

  // Refresh UI
  await loadAndRender();
  showToast('Flight logged: ' + (f.depAirport || '?') + ' → ' + (f.arrAirport || '?'));
}

function trackDistance(track) {
  let d = 0;
  for (let i = 1; i < track.length; i++) d += haversineNm(track[i-1], track[i]);
  return Math.round(d * 10) / 10;
}

function haversineNm(a, b) {
  if (!a || !b) return 0;
  const R = 3440.065, dLat = (b.lat - a.lat) * Math.PI/180, dLon = (b.lon - a.lon) * Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(h));
}

function nearestAirport(lat, lon) {
  // Bundled OurAirports snapshot (loaded as an ES module in this page).
  const list = window.StratosAirports || [];
  let best = null, bestNm = 8;
  const toRad = Math.PI / 180;
  for (const airport of list) {
    const dLat = (airport.lat - lat) * toRad;
    const dLon = (airport.lon - lon) * toRad;
    const h = Math.sin(dLat/2)**2 + Math.cos(lat*toRad)*Math.cos(airport.lat*toRad)*Math.sin(dLon/2)**2;
    const nm = 3440.065 * 2 * Math.asin(Math.sqrt(Math.min(1, Math.max(0, h))));
    if (nm < bestNm) { bestNm = nm; best = airport.id; }
  }
  return best;
}

/* ════════════════════════════════════════════════════════════════════
   BRIDGE CONNECTION  (EventSource to stratos_bridge.py)
═══════════════════════════════════════════════════════════════════════ */
let bridgeES = null, bridgeConnected = false;
let liveFlightSeconds = 0;

let bridgeOwnsRecording = false;
let lastBridgePhase = null;
let lastBridgeSync = 0;

function connectBridge(base) {
  if (bridgeES) bridgeES.close();
  try {
    bridgeES = new EventSource(base + '/stream?hz=2');
    bridgeES.onopen = () => { bridgeConnected = true; syncBridgeLogbook(base, true); };
    bridgeES.onmessage = e => {
      try {
        const data = JSON.parse(e.data);
        bridgeConnected = true;
        // The bridge records flights in its own logbook, including landing
        // analytics. The browser must not create a second copy.
        if (typeof data.flightPhase === 'string') {
          bridgeOwnsRecording = true;
          updateBridgeLive(data);
          const phase = data.flightPhase;
          if (phase === 'PARKED' && lastBridgePhase && lastBridgePhase !== 'PARKED') {
            setTimeout(() => syncBridgeLogbook(base, false), 1500);
          }
          lastBridgePhase = phase;
          return;
        }
        processTelemetry(data);
      } catch(_) {}
    };
    bridgeES.onerror = () => { bridgeConnected = false; };
  } catch(_) {}
}

function updateBridgeLive(data) {
  const bar = document.getElementById('live-bar');
  if (!bar) return;
  if (data.flightPhase === 'PARKED' && !data.currentFlight) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('live-state-label').textContent = data.flightPhase || 'PARKED';
  const flight = data.currentFlight;
  if (flight && flight.takeoffTime) {
    clearInterval(liveTimerInt);
    const tick = () => {
      const seconds = Math.max(0, Math.floor((Date.now() - flight.takeoffTime) / 1000));
      document.getElementById('live-timer').textContent = fmtDurSec(seconds);
    };
    tick();
    liveTimerInt = setInterval(tick, 1000);
  }
}

async function syncBridgeLogbook(base, quiet) {
  if (Date.now() - lastBridgeSync < 5000) return;
  lastBridgeSync = Date.now();
  try {
    const response = await fetch(base + '/logbook.json', { cache: 'no-store', credentials: location.protocol === 'file:' ? 'omit' : 'include' });
    if (!response.ok) return;
    const remote = await response.json();
    if (!Array.isArray(remote) || !remote.length) return;
    const local = await dbAll('flights');
    const known = new Set(local.map(f => f.id));
    let added = 0;
    for (const flight of remote) {
      if (!flight || !flight.id) continue;
      if (known.has(flight.id)) continue;
      await dbPut('flights', { ...flight, recordedBy: flight.recordedBy || 'bridge' });
      known.add(flight.id);
      added++;
    }
    if (added) {
      await loadAndRender();
      if (!quiet) showToast('Imported ' + added + ' flight' + (added === 1 ? '' : 's') + ' from the bridge.');
    }
  } catch (_) {}
}

// Auto-connect if on local bridge
if (location.protocol === 'http:') {
  connectBridge(location.origin);
} else if (location.protocol === 'file:') {
  connectBridge('http://127.0.0.1:8765');
}

function updateLiveBar(f) {
  const bar = document.getElementById('live-bar');
  if (!f || !currentFlight) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('live-state-label').textContent = f.state;
  if (f.takeoffTime && !f.landingTime) {
    liveFlightSeconds = Math.floor((Date.now() - f.takeoffTime) / 1000);
    clearInterval(liveTimerInt);
    liveTimerInt = setInterval(() => {
      liveFlightSeconds++;
      document.getElementById('live-timer').textContent = fmtDurSec(liveFlightSeconds);
    }, 1000);
  }
}

/* ════════════════════════════════════════════════════════════════════
   STATISTICS
═══════════════════════════════════════════════════════════════════════ */
function calcStats(flights) {
  const done = flights.filter(f => f.complete && !f.incomplete);

  let totalFlights = done.length;
  let totalHours = 0, totalAirborne = 0, totalDist = 0;
  let longestFlight = null, longestDur = 0;
  const acMap = {}, aptMap = {};
  const monthMap = {};
  const rates = [];

  const now = new Date(), weekStart = new Date();
  weekStart.setDate(now.getDate() - now.getDay());
  let thisWeek=0, thisMonth=0, thisYear=0;

  done.forEach(f => {
    const dur = f.takeoffTime && f.landingTime
      ? (f.landingTime - f.takeoffTime) / 3600000 : 0;
    const airDur = dur; // same if we're only counting airborne
    const dist = f.distanceNm || 0;

    totalHours += dur;
    totalAirborne += airDur;
    totalDist += dist;

    if (dur > longestDur) { longestDur = dur; longestFlight = f; }

    // Aircraft
    const acKey = f.aircraft || 'Unknown';
    if (!acMap[acKey]) acMap[acKey] = { flights:0, hours:0, last:0, reg: f.registration || '' };
    acMap[acKey].flights++;
    acMap[acKey].hours += dur;
    if (f.startTime > acMap[acKey].last) acMap[acKey].last = f.startTime;

    // Airports
    [f.depAirport, f.arrAirport].filter(Boolean).forEach(apt => {
      if (!aptMap[apt]) aptMap[apt] = { dep:0, arr:0, last:0 };
      if (apt === f.depAirport) aptMap[apt].dep++;
      if (apt === f.arrAirport) aptMap[apt].arr++;
      if (f.startTime > aptMap[apt].last) aptMap[apt].last = f.startTime;
    });

    // Monthly chart
    if (f.startTime) {
      const d = new Date(f.startTime);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      monthMap[key] = (monthMap[key] || 0) + dur;
    }

    // Time windows
    if (f.startTime) {
      const d = new Date(f.startTime);
      if (d >= weekStart) thisWeek++;
      if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) thisMonth++;
      if (d.getFullYear() === now.getFullYear()) thisYear++;
    }

    // Landing rates
    if (f.landingVS !== null && f.landingVS !== undefined) rates.push(f.landingVS);
  });

  const sortedAC = Object.entries(acMap).sort((a,b) => b[1].flights - a[1].flights);
  const sortedApt = Object.entries(aptMap).sort((a,b) => (b[1].dep+b[1].arr) - (a[1].dep+a[1].arr));

  return {
    totalFlights, totalHours, totalAirborne, totalDist, longestFlight, longestDur,
    acMap, aptMap, sortedAC, sortedApt, monthMap, thisWeek, thisMonth, thisYear,
    avgDur: totalFlights ? totalHours / totalFlights : 0,
    uniqueAircraft: Object.keys(acMap).length,
    uniqueAirports: Object.keys(aptMap).length,
    mostFlownAC: sortedAC[0] ? sortedAC[0][0] : '—',
    mostVisitedApt: sortedApt[0] ? sortedApt[0][0] : '—',
    avgLandingRate: rates.length ? rates.reduce((a,b)=>a+b,0)/rates.length : null,
    bestLandingRate: rates.length ? Math.min(...rates) : null,
    landingRates: rates,
    allFlights: flights // includes incomplete
  };
}

];

let earnedAchievements = {}; // id -> { earnedAt }

async function loadAchievements() {
  const rows = await dbAll('profile');
  const row = rows.find(r => r.key === 'achievements');
  if (row) earnedAchievements = row.value || {};
}

async function checkAchievements(flights) {
  const stats = calcStats(flights);
  let changed = false;
  ACHIEVEMENTS.forEach(a => {
    if (!earnedAchievements[a.id] && a.check(stats)) {
      earnedAchievements[a.id] = { earnedAt: Date.now() };
      changed = true;
    }
  });
  if (changed) {
    await dbPut('profile', { key: 'achievements', value: earnedAchievements });
  }
}

/* ════════════════════════════════════════════════════════════════════
   RENDERING
═══════════════════════════════════════════════════════════════════════ */
let allFlights = [], stats = null, activeTab = 'overview';

async function loadAndRender() {
  allFlights = await dbAll('flights');
  allFlights.sort((a,b) => (b.startTime||0) - (a.startTime||0));
  stats = calcStats(allFlights);
  renderActiveTab();
}

function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('act'));
  btn.classList.add('act');
  activeTab = btn.dataset.tab;
  document.querySelectorAll('.tab-panel').forEach(el => el.style.display = 'none');
  document.getElementById('tab-' + activeTab).style.display = '';
  renderActiveTab();
}

function renderActiveTab() {
  switch(activeTab) {
    case 'overview':     renderOverview(); break;
    case 'flights':      renderFlights(); break;
    case 'aircraft':     renderAircraft(); break;
    case 'airports':     renderAirportsTab(); break;
    case 'achievements': renderAchievements(); break;
    case 'profile':      renderProfileTab(); break;
  }
}

/* ── Overview ── */
function renderOverview() {
  const s = stats;

  // Mini profile header
  document.getElementById('profile-header-mini').innerHTML = `
    <div class="pilot-header">
      <div class="avatar-circle">${profile.avatar || '✈'}</div>
      <div class="pilot-info">
        <h3>${profile.displayName || 'Pilot'}</h3>
        <p>${profile.sim || 'Flight Simulator'} · ${s.totalFlights} flights logged</p>
      </div>
    </div>`;

  // Stat tiles
  document.getElementById('stat-grid').innerHTML = [
    { label:'Total Flights', val: s.totalFlights },
    { label:'Flight Hours', val: fmtHours(s.totalHours) },
    { label:'Total Distance', val: s.totalDist.toFixed(0) + ' nm' },
    { label:'Longest Flight', val: s.longestDur ? fmtHours(s.longestDur) : '—' },
    { label:'Aircraft Types', val: s.uniqueAircraft },
    { label:'Airports Visited', val: s.uniqueAirports },
    { label:'Avg Duration', val: s.avgDur ? fmtHours(s.avgDur) : '—' },
    { label:'This Month', val: s.thisMonth },
  ].map(t => `<div class="stat-tile"><b>${t.val}</b><span>${t.label}</span></div>`).join('');

  // Monthly chart
  const monthKeys = Object.keys(s.monthMap).sort().slice(-12);
  if (monthKeys.length) {
    const maxH = Math.max(...monthKeys.map(k => s.monthMap[k]));
    document.getElementById('activity-chart-section').style.display = '';
    document.getElementById('monthly-chart').innerHTML = monthKeys.map(k => {
      const frac = maxH ? s.monthMap[k] / maxH : 0;
      const lbl = k.slice(5); // MM
      return `<div class="bar-col">
        <div class="bar-fill" style="height:${Math.max(4, frac*52)}px" title="${k}: ${fmtHours(s.monthMap[k])}"></div>
        <div class="bar-label">${lbl}</div>
      </div>`;
    }).join('');
  }

  // Recent flights
  const recent = allFlights.filter(f=>f.complete).slice(0,5);
  document.getElementById('recent-flights-overview').innerHTML =
    recent.length ? `<div class="section"><h2>Recent Flights</h2>${recent.map(flightRowHtml).join('')}</div>` : '';

  // Bridge status
  if (allFlights.length === 0) {
    document.getElementById('bridge-status-block').innerHTML = `
      <div class="empty-block">
        <div class="big-icon">✈</div>
        <p style="font-size:16px;font-weight:700;margin:0 0 8px">No flights logged yet</p>
        <p style="margin:0;font-size:13px">Flights are automatically recorded when you fly in X-Plane 12 or MSFS with the Stratos bridge running.</p>
        <div style="background:var(--ui2);border:1px solid var(--coast);border-radius:12px;padding:14px;margin-top:14px;text-align:left;font-size:13px">
          <b style="display:block;margin-bottom:8px">To start logging:</b>
          1. Open the Stratos desktop app — it starts the bridge automatically<br>
          2. Start a flight in X-Plane 12 or MSFS 2020/2024<br>
          3. Flights import here automatically when the bridge is reachable<br>
          <span style="color:var(--mut)">Manual start: <code style="background:var(--land);padding:2px 6px;border-radius:4px">python3 stratos_bridge.py</code> (X-Plane needs UDP rows 3, 17, 20; MSFS needs <code>pip install SimConnect</code>)</span>
        </div>
      </div>`;
  } else {
    document.getElementById('bridge-status-block').innerHTML = '';
  }
}

/* ── Flights tab ── */
function renderFlights() {
  const q = (document.getElementById('flight-search')?.value || '').toLowerCase();
  const sort = document.getElementById('flight-sort')?.value || 'date-desc';

  let flights = allFlights.filter(f => {
    if (!q) return true;
    return (f.depAirport||'').toLowerCase().includes(q) ||
           (f.arrAirport||'').toLowerCase().includes(q) ||
           (f.aircraft||'').toLowerCase().includes(q) ||
           (f.callsign||'').toLowerCase().includes(q);
  });

  flights = flights.slice().sort((a,b) => {
    if (sort === 'date-desc') return (b.startTime||0)-(a.startTime||0);
    if (sort === 'date-asc')  return (a.startTime||0)-(b.startTime||0);
    const ad = a.takeoffTime&&a.landingTime?(a.landingTime-a.takeoffTime):0;
    const bd = b.takeoffTime&&b.landingTime?(b.landingTime-b.takeoffTime):0;
    if (sort === 'dur-desc')  return bd-ad;
    if (sort === 'dist-desc') return (b.distanceNm||0)-(a.distanceNm||0);
    return 0;
  });

  const el = document.getElementById('flight-list');
  if (!flights.length) {
    el.innerHTML = '<div class="empty-block"><div class="big-icon">🗒</div><p>No flights match your search.</p></div>';
    return;
  }
  el.innerHTML = flights.map(flightRowHtml).join('');
  queueMicrotask(hydrateFlightPhotos);
}

function flightRowHtml(f) {
  const dep = f.depAirport || '?';
  const arr = f.arrAirport || '?';
  const dur = f.takeoffTime && f.landingTime ? fmtHours((f.landingTime-f.takeoffTime)/3600000) : '—';
  const dist = f.distanceNm ? f.distanceNm.toFixed(0) + ' nm' : '—';
  const date = f.startTime ? new Date(f.startTime).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '—';
  const incomplete = f.incomplete || !f.complete;
  const landing = f.landing && f.landing.vsFpm != null ? f.landing : null;
  const landingText = landing
    ? landing.vsFpm + ' fpm' + (landing.runway ? ' · RWY ' + landing.runway.id : '') + (landing.classification ? ' · ' + landing.classification.key : '')
    : (f.landingVS != null ? Math.round(f.landingVS) + ' fpm' : '');
  const replayable = Array.isArray(f.track) && f.track.length > 1;
  return `<div class="flight-row ${incomplete?'fl-incomplete':''}" onclick="openFlight('${f.id}')">
    ${f.registration ? `<img class="fl-shot" alt="" loading="lazy" data-flight-reg="${escHtml(f.registration)}">` : ''}
    <div class="fl-badge">${dep}→${arr}</div>
    <div class="fl-main">
      <div class="fl-route">${dep} → ${arr}</div>
      <div class="fl-sub">${f.aircraft || '—'} ${f.callsign ? '· ' + f.callsign : ''} ${landingText ? '· ' + landingText : ''} ${incomplete ? '· <span style="color:var(--warn)">Incomplete</span>' : ''}</div>
    </div>
    <div class="fl-right"><b>${dur}</b>${dist}<br><span>${date}</span>${replayable ? '<br><span style="color:var(--acc)">Replay ›</span>' : ''}</div>
  </div>`;
}

/* ── Aircraft tab ── */
function renderAircraft() {
  const { acMap, totalHours } = stats;
  const el = document.getElementById('aircraft-grid');
  const sorted = Object.entries(acMap).sort((a,b) => b[1].flights - a[1].flights);
  if (!sorted.length) {
    el.innerHTML = '<div class="empty-block"><div class="big-icon">✈</div><p>No aircraft in your logbook yet.</p></div>';
    return;
  }
  el.innerHTML = sorted.map(([name, data]) => `
    <div class="ac-card" onclick="openAircraft(decodeURIComponent('${encodeURIComponent(name)}'))">
      ${data.reg ? `<img class="ac-photo" alt="" loading="lazy" data-flight-reg="${escHtml(data.reg)}">` : ''}
      <div class="ac-type">${name}</div>
      <div class="ac-reg">${data.reg || ''} · Last flown ${data.last ? new Date(data.last).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '—'}</div>

        <div class="ac-stat"><b>${totalHours ? Math.round(data.hours/totalHours*100) : 0}%</b><span>OF TOTAL</span></div>
      </div>
    </div>`).join('');
}

/* ── Detail panel ── */
function openFlight(id) {
  if (acProfile) closeDetail();
  const f = allFlights.find(x => x.id === id);
  if (!f) return;
  const dur = f.takeoffTime && f.landingTime ? fmtHours((f.landingTime-f.takeoffTime)/3600000) : '—';
  const dist = f.distanceNm ? f.distanceNm.toFixed(1) + ' nm' : '—';
  const landing = f.landing && f.landing.vsFpm != null ? f.landing : null;
  const vs = landing ? landing.vsFpm + ' fpm' + (landing.runway ? ' · RWY ' + landing.runway.id : '') : (f.landingVS !== null && f.landingVS !== undefined ? Math.round(f.landingVS) + ' fpm' : '—');
  const date = f.startTime ? new Date(f.startTime).toLocaleString() : '—';
  const incomplete = f.incomplete || !f.complete;
  const replayable = Array.isArray(f.track) && f.track.length > 1;

  document.getElementById('detail-inner').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">${f.depAirport||'?'} → ${f.arrAirport||'?'}</h2>
      <button onclick="closeDetail()" style="background:var(--ui2);border:1px solid var(--coast);border-radius:8px;color:var(--txt);font:inherit;padding:6px 10px;cursor:pointer">✕</button>
    </div>
    ${incomplete ? '<div style="background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--warn);margin-bottom:10px">⚠ This flight was incomplete (bridge disconnected or flight shorter than 60 s airborne).</div>' : ''}
    <div class="detail-grid">
      <div class="detail-cell"><span>DURATION</span><b>${dur}</b></div>
      <div class="detail-cell"><span>DISTANCE</span><b>${dist}</b></div>
      <div class="detail-cell"><span>AIRCRAFT</span><b>${f.aircraft||'—'}</b></div>
      <div class="detail-cell"><span>MAX ALTITUDE</span><b>${f.maxAlt ? Math.round(f.maxAlt).toLocaleString() + ' ft' : '—'}</b></div>
      <div class="detail-cell"><span>LANDING RATE</span><b>${vs}</b></div>
      <div class="detail-cell"><span>SIMULATOR</span><b>${f.sim||'—'}</b></div>
      ${f.callsign ? `<div class="detail-cell"><span>CALLSIGN</span><b>${f.callsign}</b></div>` : ''}
      ${f.registration ? `<div class="detail-cell"><span>REGISTRATION</span><b>${f.registration}</b></div>` : ''}
    </div>
    <div style="font-size:12px;color:var(--mut);margin-top:8px">Departed: ${date}</div>
    ${replayable ? `<div style="margin-top:8px;font-size:12px;color:var(--mut)">Track: ${f.track.length} recorded samples${landing ? ' · touchdown at ' + landing.lat.toFixed(4) + ', ' + landing.lon.toFixed(4) : ''}</div>` : '<div style="margin-top:8px;font-size:12px;color:var(--mut)">No recorded position track for this flight, so replay is unavailable.</div>'}
    ${landing ? `<div class="section" style="margin-top:12px;padding:12px">
      <h2>Landing analysis</h2>
      <div class="detail-grid">
        <div class="detail-cell"><span>VERTICAL SPEED</span><b>${landing.vsFpm} fpm</b></div>
        <div class="detail-cell"><span>GROUND SPEED</span><b>${landing.gsKt != null ? landing.gsKt + ' kt' : '—'}</b></div>
        <div class="detail-cell"><span>RUNWAY</span><b>${landing.runway ? landing.runway.id : 'not matched'}</b></div>
        <div class="detail-cell"><span>FROM THRESHOLD</span><b>${landing.runway ? Math.round(landing.runway.distanceFromThresholdFt).toLocaleString() + ' ft' : '—'}</b></div>
        <div class="detail-cell"><span>RATING</span><b>${landing.classification ? landing.classification.key : '—'}</b></div>
        <div class="detail-cell"><span>SOURCE</span><b>${landing.vsSource || 'recorded'}</b></div>
      </div>
      <div style="font-size:11px;color:var(--mut);margin-top:6px">Runway and touchdown distance are estimates from the recorded position. Ratings use configurable per-aircraft thresholds.</div>
    </div>` : ''}
    <div style="display:flex;gap:8px;margin-top:14px">
      ${replayable ? `<button onclick="location.href='pilot.html#/replay?flight=' + encodeURIComponent('${f.id}')" style="flex:1;background:var(--acc);border:1px solid var(--acc);border-radius:8px;color:#04212b;font:inherit;font-weight:700;padding:10px;cursor:pointer">Replay flight</button>` : ''}
      <button onclick="deleteFlight('${f.id}')" style="flex:1;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:8px;color:var(--red);font:inherit;padding:10px;cursor:pointer">Delete flight</button>
    </div>`;
  document.getElementById('detail-panel').classList.add('show');
}

/* ════════════════════════════════════════════════════════════════════
   AIRCRAFT PHOTOGRAPHY
   The spotter photograph comes from Planespotters.net through the app's
   /api/photo route; only its metadata is cached, never a copy of the image.
   The pilot's own screenshots live in IndexedDB and are never uploaded.
═══════════════════════════════════════════════════════════════════════ */
const acPhotos = new Map();
let acProfile = null;

function acMediaApi() { return window.AIRCRAFT_MEDIA || null; }

function acLookup(registration, { force = false } = {}) {
  const api = acMediaApi();
  if (!api) return Promise.resolve({ state: 'unavailable' });
  const key = api.photoCacheKey({ registration });
  if (!key) return Promise.resolve({ state: 'none', reason: 'no-airframe' });
  if (!force && acPhotos.has(key)) return Promise.resolve(acPhotos.get(key));
  return api.lookupPhoto({ registration }, { force }).then(outcome => {
    acPhotos.set(key, outcome);
    return outcome;
  });
}

/** Show a photo beside flights and aircraft cards, one lookup per airframe. */
async function hydrateFlightPhotos() {
  const images = [...document.querySelectorAll('img[data-flight-reg]:not([data-shot])')].slice(0, 12);
  for (const image of images) {
    image.dataset.shot = '1';
    const outcome = await acLookup(image.dataset.flightReg);
    if (outcome.state === 'ok' && outcome.photo) {
      image.src = outcome.photo.thumb || outcome.photo.src;
      image.alt = 'Aircraft ' + image.dataset.flightReg;
      image.title = outcome.photo.photographer
        ? 'Photo: ' + outcome.photo.photographer + ' · Planespotters.net'
        : 'Photo: Planespotters.net';
      image.classList.add('has-shot');
    } else {
      image.classList.add('no-shot');
      image.removeAttribute('src');
    }
  }
}

function acSpotterMessage(p) {
  if (!p.reg) return 'No registration is reported for this aircraft, so a photograph cannot be matched to it.';
  if (!p.spotter) return 'Looking up a photograph by registration…';
  if (p.spotter.state === 'none') return 'Planespotters.net has no photograph of ' + p.reg + '.';
  return 'The photo lookup did not answer. Find Image tries again.';
}

function acGalleryHtml(p) {
  const api = acMediaApi();
  const count = p.photos.length;
  const stage = count ? p.photos[p.index] : null;
  const image = stage && p.urls[p.index]
    ? `<img src="${escHtml(p.urls[p.index])}" alt="A photo of ${escHtml(p.name)} added by the pilot">`
    : '';
  const nav = count > 1
    ? '<button class="acp-btn acp-nav prev" type="button" onclick="slideAircraft(-1)" aria-label="Previous photo">‹</button>'
      + '<button class="acp-btn acp-nav next" type="button" onclick="slideAircraft(1)" aria-label="Next photo">›</button>'
    : '';
  const thumbs = count ? `<div class="acp-thumbs">${p.photos.map((photo, index) => `
    <span class="acp-thumb${index === p.index ? ' on' : ''}">
      <button class="pick" type="button" onclick="pickAircraftPhoto(${index})" aria-label="Photo ${index + 1}"><img src="${escHtml(p.urls[index] || '')}" alt="" loading="lazy"></button>
      <button class="x" type="button" onclick="removeAircraftPhoto(${photo.id}, event)" title="Remove this photo">✕</button>
    </span>`).join('')}</div>` : '';
  const intervals = (api ? api.SLIDESHOW_INTERVALS : [0, 4, 6, 8, 12, 20]);
  return `<div class="acp-stage">${image || '<div class="acp-empty">No photos of your own yet. Add a screenshot and it stays on this device.</div>'}${nav}</div>
    ${thumbs}
    <div class="acp-bar">
      <label class="acp-upload">Add photos<input type="file" accept="image/*" multiple onchange="addAircraftPhotos(this)"></label>
      <label>Slideshow
        <select onchange="setAircraftSlideshow(this.value)">${intervals.map(seconds => `<option value="${seconds}"${seconds === p.interval ? ' selected' : ''}>${seconds ? `every ${seconds}s` : 'off'}</option>`).join('')}</select>
      </label>
      <span class="acp-msg">${count ? `${p.index + 1} of ${count}` : ''}${p.interval && count > 1 ? ' · cycling' : ''}</span>
    </div>`;
}

function renderAircraftGallery() {
  const p = acProfile;
  if (!p) return;
  const host = document.getElementById('acp-gallery');
  if (host) host.innerHTML = acGalleryHtml(p);
}

function stopAircraftSlideshow() {
  if (acProfile && acProfile.timer) { clearInterval(acProfile.timer); acProfile.timer = null; }
}

function startAircraftSlideshow() {
  stopAircraftSlideshow();
  const p = acProfile;
  if (!p || !p.interval || p.photos.length < 2) return;
  p.timer = setInterval(() => {
    if (!acProfile || acProfile !== p) return;
    p.index = (acMediaApi() ? acMediaApi().nextSlide(p.index, p.photos.length) : (p.index + 1) % p.photos.length);
    renderAircraftGallery();
  }, p.interval * 1000);
}

function renderAircraftProfile() {
  const p = acProfile;
  if (!p) return;
  stopAircraftSlideshow();
  const photo = p.spotter && p.spotter.state === 'ok' ? p.spotter.photo : null;
  const flights = allFlights.filter(f => f.aircraft === p.name && f.complete && !f.incomplete);
  const hours = flights.reduce((sum, f) => sum + (f.takeoffTime && f.landingTime ? (f.landingTime - f.takeoffTime) / 3600000 : 0), 0);
  const shot = photo
    ? `<figure class="acp-shot"><a href="${escHtml(photo.link)}" target="_blank" rel="noopener"><img src="${escHtml(photo.src)}" alt="${escHtml(p.name)} ${escHtml(p.reg)}" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>Planespotters ${photo.photographer ? '© ' + escHtml(photo.photographer) : '.net'} · <a href="${escHtml(photo.link)}" target="_blank" rel="noopener">original photograph</a></figcaption></figure>`
    : `<div class="acp-shot none"><b>${escHtml(p.reg || p.name)}</b><span>${escHtml(acSpotterMessage(p))}</span></div>`;
  document.getElementById('detail-inner').innerHTML = `
    <div class="acp-head"><h2>✈ ${escHtml(p.name)}</h2><button class="acp-btn" type="button" onclick="closeDetail()">✕</button></div>
    <div class="acp-meta"><span class="acp-reg">${escHtml(p.reg || '—')}</span><span>${escHtml(p.name)}</span><span>${flights.length} flight${flights.length === 1 ? '' : 's'} · ${fmtHours(hours)}</span></div>
    ${shot}
    <div class="acp-tools">
      <button class="acp-btn primary" type="button" onclick="findAircraftImage()"${p.reg && !p.busy ? '' : ' disabled'}>Find Image</button>
      <span class="acp-msg">${escHtml(p.notice || (photo ? 'Spotter photo shown with credit and a link to the original.' : ''))}</span>
    </div>
    <div class="section" style="margin-top:12px"><h2>Photo gallery</h2><div id="acp-gallery" class="acp-gallery">${acGalleryHtml(p)}</div></div>
    <div class="section"><h2>Flight history</h2>${flights.length ? flights.slice(0, 20).map(flightRowHtml).join('') : '<div class="empty-block" style="padding:16px 0">No completed flights yet.</div>'}</div>`;
  startAircraftSlideshow();
  queueMicrotask(hydrateFlightPhotos);
}

async function loadAircraftProfile() {
  const p = acProfile;
  if (!p) return;
  const api = acMediaApi();
  renderAircraftProfile();
  const [spotter, photos, saved] = await Promise.all([
    p.reg ? acLookup(p.reg) : Promise.resolve({ state: 'none', reason: 'no-registration' }),
    p.key && api ? api.listAircraftPhotos(p.key).catch(() => []) : Promise.resolve([]),
    api ? api.getGallerySetting('slideshow', 8).catch(() => 8) : Promise.resolve(0),
  ]);
  if (acProfile !== p) return;
  p.spotter = spotter;
  p.photos = photos;
  p.urls = photos.map(row => URL.createObjectURL(row.blob));
  p.index = 0;
  p.interval = api ? api.slideshowInterval(saved) : 0;
  renderAircraftProfile();
}

async function reloadAircraftPhotos() {
  const p = acProfile;
  if (!p) return;
  const api = acMediaApi();
  (p.urls || []).forEach(url => URL.revokeObjectURL(url));
  p.photos = p.key && api ? await api.listAircraftPhotos(p.key).catch(() => []) : [];
  p.urls = p.photos.map(row => URL.createObjectURL(row.blob));
  p.index = Math.min(p.index, Math.max(0, p.photos.length - 1));
  renderAircraftProfile();
}

function openAircraft(name) {
  if (acProfile) closeDetail();
  const row = (stats.acMap && stats.acMap[name]) || {};
  const reg = String(row.reg || '').trim().toUpperCase();
  const api = acMediaApi();
  acProfile = {
    name, reg, key: api ? api.aircraftKey({ registration: reg, type: name }) : '',
    photos: [], urls: [], index: 0, interval: 8, timer: null, spotter: null, busy: false, notice: '',
  };
  document.getElementById('detail-inner').innerHTML = '<div class="e-loading" style="padding:24px 0">Loading the aircraft…</div>';
  document.getElementById('detail-panel').classList.add('show');
  renderAircraftProfile();
  loadAircraftProfile();
}

function slideAircraft(step) {
  const p = acProfile;
  if (!p || p.photos.length < 2) return;
  p.index = acMediaApi() ? acMediaApi().nextSlide(p.index, p.photos.length, step) : (p.index + step + p.photos.length) % p.photos.length;
  renderAircraftGallery();
}

function pickAircraftPhoto(index) {
  const p = acProfile;
  if (!p || !p.photos[index]) return;
  p.index = index;
  renderAircraftGallery();
}

async function setAircraftSlideshow(value) {
  const p = acProfile;
  if (!p) return;
  const api = acMediaApi();
  p.interval = api ? api.slideshowInterval(value) : Number(value) || 0;
  if (api) await api.setGallerySetting('slideshow', p.interval).catch(() => {});
  renderAircraftGallery();
  startAircraftSlideshow();
}

async function addAircraftPhotos(input) {
  const p = acProfile;
  const api = acMediaApi();
  if (!p || !api) { showToast('Photo storage is not available on this page.'); return; }
  if (!p.key) { showToast('This aircraft has no registration, so photos cannot be attached.'); return; }
  const files = [...(input.files || [])].slice(0, 12);
  let added = 0;
  let failed = '';
  for (const file of files) {
    try { await api.addAircraftPhoto(p.key, file); added += 1; }
    catch (error) { failed = error.message || 'The photo could not be stored.'; }
  }
  input.value = '';
  p.notice = added ? `${added} photo${added === 1 ? '' : 's'} added on this device.` : failed;
  await reloadAircraftPhotos();
  if (added) showToast(p.notice);
}

async function removeAircraftPhoto(id, event) {
  if (event) event.stopPropagation();
  const p = acProfile;
  const api = acMediaApi();
  if (!p || !api || !confirm('Remove this photo from the aircraft gallery?')) return;
  await api.deleteAircraftPhoto(id).catch(() => {});
  await reloadAircraftPhotos();
}

async function findAircraftImage() {
  const p = acProfile;
  if (!p || !p.reg) return;
  p.busy = true;
  p.notice = 'Searching Planespotters.net for ' + p.reg + '…';
  renderAircraftProfile();
  const outcome = await acLookup(p.reg, { force: true });
  if (acProfile !== p) return;
  p.spotter = outcome;
  p.busy = false;
  p.notice = outcome.state === 'ok'
    ? 'Photograph refreshed from Planespotters.net.'
    : outcome.state === 'none'
      ? 'No photograph of ' + p.reg + ' is published.'
      : 'The photo service did not answer. Try again in a moment.';
  renderAircraftProfile();
}

function closeDetail() {
  if (acProfile) {
    stopAircraftSlideshow();
    (acProfile.urls || []).forEach(url => URL.revokeObjectURL(url));
    acProfile = null;
  }
  document.getElementById('detail-panel').classList.remove('show');
}

/* The module that owns the lookup cache runs after this inline script; when it
   is ready, fill in the photos already on screen. */
(function waitForAircraftMedia() {
  if (window.AIRCRAFT_MEDIA) { queueMicrotask(hydrateFlightPhotos); return; }
  window.addEventListener('aircraft-media-ready', () => {
    hydrateFlightPhotos();
    if (acProfile) loadAircraftProfile();
  }, { once: true });
})();

async function deleteFlight(id) {
  if (!confirm('Delete this flight record? This cannot be undone.')) return;
  await dbDelete('flights', id);
  closeDetail();
  await loadAndRender();
  showToast('Flight deleted.');
}

async function clearAllFlights() {
  if (!confirm('Delete ALL flight records? This cannot be undone.')) return;
  const all = await dbAll('flights');
  for (const f of all) await dbDelete('flights', f.id);
  await loadAndRender();
  showToast('All flights cleared.');
}

/* ════════════════════════════════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════════════════════════════════ */
function exportCSV() {
  const headers = ['ID','Date','Departure','Arrival','Aircraft','Registration','Callsign',
    'Duration (h)','Distance (nm)','Max Altitude (ft)','Landing Rate (fpm)','Simulator','Complete'];
  const rows = allFlights.map(f => [
    f.id,
    f.startTime ? new Date(f.startTime).toISOString() : '',
    f.depAirport || '',
    f.arrAirport || '',
    f.aircraft || '',
    f.registration || '',
    f.callsign || '',
    f.takeoffTime && f.landingTime ? ((f.landingTime-f.takeoffTime)/3600000).toFixed(2) : '',
    f.distanceNm || '',
    f.maxAlt ? Math.round(f.maxAlt) : '',
    f.landingVS !== null && f.landingVS !== undefined ? Math.round(f.landingVS) : '',
    f.sim || '',
    f.complete && !f.incomplete ? 'Yes' : 'No'
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'stratos_logbook_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

/* ════════════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════════════ */
function fmtHours(h) {
  if (!h || !isFinite(h)) return '0:00';
  const hr = Math.floor(h), mn = Math.round((h - hr) * 60);
  return hr + ':' + String(mn).padStart(2,'0');
}

function fmtDurSec(s) {
  const hr = Math.floor(s/3600), mn = Math.floor((s%3600)/60), sc = s%60;
  return hr ? hr+':'+String(mn).padStart(2,'0')+':'+String(sc).padStart(2,'0')
            : mn+':'+String(sc).padStart(2,'0');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--acc);color:#04212b;font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px;z-index:100;transition:opacity .4s';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity=0; setTimeout(()=>t.remove(),400); }, 2500);
}
