<title>Pilot · Stratos</title>
<style>
  /* Embedded as a plate over the map (index.html loads this page with
     embed=1): the chart viewer keeps the whole window, the pilot chrome goes. */
  html[data-embed] #appbar, html[data-embed] .subnav { display: none !important; }
  html[data-embed] body { background: #050b11; }
  html[data-embed] .shell { padding: 0 !important; margin: 0 !important; max-width: none !important; }
  html[data-embed] .page { padding: 0 !important; margin: 0 !important; max-width: none !important; }
  html[data-embed] #view { padding: 0 !important; }
</style>
<script>
  /* The chart route puts its parameters in the hash (pilot.html#charts?icao=…),
     so the embed flag is read from there as well as from the query string. */
  (function () {
    function sync() {
      try {
        var hash = location.hash || '';
        var raw = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?') + 1) : location.search.slice(1);
        if (new URLSearchParams(raw).get('embed') === '1') document.documentElement.dataset.embed = '1';
        else delete document.documentElement.dataset.embed;
      } catch (_) { /* an unreadable URL simply stays a normal page */ }
    }
    sync();
    window.addEventListener('hashchange', sync);
  })();
</script>
<script src="js/account/gate.js"></script></head>
<body data-mobile-section="profile">
<div class="shell">
  <header id="appbar" class="tb"></header>

  <main class="page">

      <button data-section="landings" type="button">Landings</button>
      <button data-section="replay" type="button">Replay</button>
      <button data-section="briefing" type="button">Briefing</button>

    </nav>
    <div id="view" role="region" aria-live="polite"></div>
  </main>
</div>

<noscript><p style="padding:24px">Stratos Pilot needs JavaScript. The map and logbook also require JavaScript.</p></noscript>
<script src="vendor/qrcode.js"></script>

<script type="module">
  import { mountShell } from './js/shell.js';
  mountShell({ page: 'stats', theme: true });
</script>
<script>
  // Graceful message when opened from file:// — ES modules are blocked there by
  // the browser; the packaged desktop app is served by the bridge or Electron.
  window.addEventListener('error', function (event) {
    if (document.getElementById('view') && !document.querySelector('#view .card')) {
      document.getElementById('view').innerHTML = '<div class="notice bad"><div><strong>Stratos could not start.</strong><br>' +
        String(event.message || 'Unknown error') + '</div></div>';
    }
  });
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.register('sw.js').catch(function () {});
  } catch (_) {}
</script>
<script type="module" src="js/mobile.js"></script>
</body>
</html>
